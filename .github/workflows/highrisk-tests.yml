name: High-risk tests

# 고위험 경로(결제·인증·개인정보) 회귀 게이트.
#
# 배경(G2 2026-07-27 실측): 이 레포는 테스트 파일 0개 · test 스크립트 0 · 테스트 런너 0 이었다.
# welkor 에는 결제가 없지만 **개인정보(국적·비자 = 민감정보)** 수집 경로가 있고,
# 그 경로를 지키는 장치가 코드 두 줄(분리 동의 삼항식)뿐이었다.
# 범위는 `tests/highrisk/**` 로 한정한다 — 전면 커버리지가 목표가 아니다.
#
# 대상 목록의 출처: G2 `eval/highrisk_paths.json` (2026-07-27 동결, welkor 9개 경로).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  highrisk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Run high-risk tests
        run: npm test

      # 2026-07-30 L2 — 테스트만으로는 못 잡는 결함이 실제로 있었다.
      # 직전 세션이 vitest 를 넣고 `next build` 를 안 돌려 cinderella 프로덕션 빌드가
      # exit 1 로 깨진 채 CI 는 초록이었다(테스트 게이트는 npm test 만 돈다).
      # 배포 전에 타입체크·프리렌더를 여기서 한 번 깬다.
      - name: Build (프로덕션 타입체크·프리렌더)
        run: npm run build

      - name: Summary
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "### ✅ 고위험 경로 테스트 통과" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ 고위험 경로 테스트 실패 — 개인정보(민감정보 동의) 회귀 가능성" >> $GITHUB_STEP_SUMMARY
            echo "범위: \`tests/highrisk/**\` (G2 eval/highrisk_paths.json 동결 목록 기준)" >> $GITHUB_STEP_SUMMARY
          fi
